# Configuration v0.1, read by `niten prepare` (--config, or
# $XDG_CONFIG_HOME/niten/config.toml, or ~/.config/niten/config.toml).
# Unknown keys are errors. These values equal the built-in defaults, except that the
# defaults leave claude_settings_template unset.
executor = "claude/claude-opus-5-5:xhigh"
reviewer = "codex/gpt-6-astra:xhigh"

claude_command = "claude"
# An executable or an absolute path; shell aliases/functions are not supported.
codex_command = "codex"
shogun_command = "shogun"

# Empty = $XDG_STATE_HOME/niten or ~/.local/state/niten.
# prepare rejects a path inside the source repo or a model write root.
store_dir = ""
claude_settings_template = "claude-settings.template.json"
verifier_backend = "macos-seatbelt"

# Physical CLI starts; the CLI's internal model requests are not bounded by this.
max_invocations = 24
max_active_time = "90m"
invocation_deadline = "20m"
max_repairs_per_step = 2
# v0.1 is sequential; nonzero is unsupported until a later P4 decision.
max_ahead_steps = 0
gate_per_step = false

# Taken from the shared remainder; not added on top of the budget.
final_reserve_invocations = 3
final_reserve_time = "20m"

# Additional Claude-only cap by the CLI's accounting, not a shared limit for the pair.
# claude_max_budget_usd_per_invocation = 5.0

# Already covered by the mandatory built-in filter; shown here explicitly.
# Removing them from here does not disable the built-in filtering.
strip_env = ["CLAUDE_CODE_SUBAGENT_MODEL", "CLAUDE_CODE_EFFORT_LEVEL", "ANTHROPIC_MODEL"]

[policy]
tool_network = "deny"
# Logical names: prepare resolves them into canonical absolute paths.
# Each process receives only its own roots.
write_roots = ["executor_source", "executor_scratch", "reviewer_copy", "reviewer_scratch", "verifier_copy", "verifier_scratch"]
protected_paths = [".git", "**/.git", "**/.git/**", ".claude/**", "**/.claude/**", ".codex/**", "**/.codex/**", ".agents/**", "**/.agents/**", ".mcp.json", "**/.mcp.json"]
instruction_paths = ["AGENTS.md", "**/AGENTS.md", "CLAUDE.md", "**/CLAUDE.md"]
# The source repo, external gitdir, store, settings, auth roots and context copies
# are added by the coordinator to the mandatory deny rules by absolute path.

# Allowing a command does NOT make it a required check.
[[policy.commands]]
id = "go-test"
argv = ["go", "test", "./..."]
timeout = "10m"

[[policy.commands]]
id = "go-build"
argv = ["go", "build", "./..."]
timeout = "10m"

[[policy.commands]]
id = "go-vet"
argv = ["go", "vet", "./..."]
timeout = "10m"

# A required check references an allowed command.
# criterion_ids are assigned by the specific execution contract.
[[checks.required]]
id = "go-tests"
command_id = "go-test"
cwd = "."
expected_exit_code = 0

# The operational sandbox policy is defined separately and verified in P0.
# This TOML is not sufficient to certify the models' file system access.
